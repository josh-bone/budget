
[project]
name = "budget"
version = "0.2.0"
description = "Small budgeting utilities and CLI for personal finance."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Joshua Bone", email = "jbone.data@gmail.com" }
]
keywords = ["budget", "finance", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "google-auth",
    "google-auth-oauthlib",
    "google-api-python-client",
    "tabulate",
    "flask",
    "gunicorn",
    "pandas",
    "numpy",
    "requests",
]

[project.scripts]
budget = "budget.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["budget"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
